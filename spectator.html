<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>System Dialer</title>
  <link rel="stylesheet" href="spectator.css">
</head>
<body class="ios">
  <div class="phone-shell">
    <div class="dialer-screen">
      
      <div class="number-display" id="numberDisplay"></div>

      <div class="keypad">
        <button class="key" data-key="1">
          <div class="key-content">
            <span class="number">1</span>
            <small class="letters">&nbsp;</small>
          </div>
        </button>
        <button class="key" data-key="2">
          <div class="key-content">
            <span class="number">2</span>
            <small class="letters">A B C</small>
          </div>
        </button>
        <button class="key" data-key="3">
          <div class="key-content">
            <span class="number">3</span>
            <small class="letters">D E F</small>
          </div>
        </button>
        <button class="key" data-key="4">
          <div class="key-content">
            <span class="number">4</span>
            <small class="letters">G H I</small>
          </div>
        </button>
        <button class="key" data-key="5">
          <div class="key-content">
            <span class="number">5</span>
            <small class="letters">J K L</small>
          </div>
        </button>
        <button class="key" data-key="6">
          <div class="key-content">
            <span class="number">6</span>
            <small class="letters">M N O</small>
          </div>
        </button>
        <button class="key" data-key="7">
          <div class="key-content">
            <span class="number">7</span>
            <small class="letters">P Q R S</small>
          </div>
        </button>
        <button class="key" data-key="8">
          <div class="key-content">
            <span class="number">8</span>
            <small class="letters">T U V</small>
          </div>
        </button>
        <button class="key" data-key="9">
          <div class="key-content">
            <span class="number">9</span>
            <small class="letters">W X Y Z</small>
          </div>
        </button>
        <button class="key symbol" data-key="*">
          <div class="key-content">
            <span class="number">✶</span>
            <small class="letters">&nbsp;</small>
          </div>
        </button>
        <button class="key" data-key="0">
          <div class="key-content">
            <span class="number">0</span>
            <small class="letters">+</small>
          </div>
        </button>
        <button class="key symbol" data-key="#">
          <div class="key-content">
            <span class="number">#</span>
            <small class="letters">&nbsp;</small>
          </div>
        </button>
      </div>

      <div class="actions">
        <div class="spacer-button"></div>
        <button class="call-button" type="button">
          <span class="call-icon-unicode">📞</span>
        </button>
        <button class="delete-button" id="deleteButton" type="button">
          <svg width="34" height="24" viewBox="0 0 34 24" fill="none">
            <path d="M12.5 0.5L0 12L12.5 23.5H33.5V0.5H12.5ZM26.5 17.5L24.5 15.5L22.5 17.5L21 16L23 14L21 12L22.5 10.5L24.5 12.5L26.5 10.5L28 12L26 14L28 16L26.5 17.5Z" fill="currentColor"/>
          </svg>
        </button>
      </div>

      <div class="tabbar">
        <button><span>⭐</span><small>Favoritos</small></button>
        <button><span>🕒</span><small>Recientes</small></button>
        <button><span>👤</span><small>Contactos</small></button>
        <button class="active"><span>🔢</span><small>Teclado</small></button>
        <button><span>📟</span><small>Voicemail</small></button>
      </div>

    </div>
  </div>

  <div class="device-modal" id="deviceModal">
    <div class="modal-scrim" data-close></div>
    <div class="device-card">
      <h2 id="modalTitle">Información del dispositivo</h2>
      <div class="device-info">
        <div class="info-row">
          <p class="info-label">IMEI 1</p>
          <p class="info-value" id="imei1Value">--</p>
          <div class="barcode" id="imei1Barcode"></div>
        </div>
        <div class="info-row">
          <p class="info-label">IMEI 2</p>
          <p class="info-value" id="imei2Value">--</p>
          <div class="barcode" id="imei2Barcode"></div>
        </div>
        <div class="info-row">
          <p class="info-label">Número de serie</p>
          <p class="info-value" id="snValue">--</p>
          <div class="barcode" id="snBarcode"></div>
        </div>
      </div>
      <button class="modal-ok" data-close>Aceptar</button>
    </div>
  </div>

  <script src="firebase-config.js"></script>
  <script src="spectator.js"></script>
</body>
</html>
